<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Modifier</title>
</head>

<body>
    <h2 id="title">📝Text Modifier</h2>
    <textarea name="" id="textBox" rows="4" cols="40" placeholder="Type something ..."></textarea>
    <div id="buttonCounter">
        <button id="increaseSize">A+</button>
        <button id="decreaseSize">A-</button>
        <button id="changeColor">Color</button>
        <button id="bold">Bold</button>
        <button id="italic">Italic</button>
        <button id="underline">Underline</button>
    </div>
    <script src="script.js"></script>
</body>

</html>
