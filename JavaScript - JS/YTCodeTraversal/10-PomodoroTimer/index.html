<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="timer">25:00</div>
        <h1 class="title">Click Start For Work Time</h1>

        <div class="buttons">
            <button class="startBtn" style="--clr:#b134a093">Start</button>
            <button class="pauseBtn" style="--clr:#4ba6327b">Pause</button>
            <button class="resumeBtn" style="--clr:#63048ffd">Resume</button>
            <button class="resetBtn" style="--clr:#34b1ad93">Reset</button>
        </div>

        <div class="pomoCountDisplay">
            <span class="count">0</span>
            <p>Pomodoros Completed</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
