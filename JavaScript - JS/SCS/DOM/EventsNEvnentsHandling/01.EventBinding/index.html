<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Binding</title>

    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            gap: 3rem;
            align-items: center;
            background: #242424;
        }

        #btn {
            background: #a96767;
            font-size: 3vw;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            color: #3a3a39;
            border: none;
            border-radius: .8vw;
            padding: .38vw;
            transition: .3s ease-in-out;
            letter-spacing: .23vw;
        }

        #btn:hover {
            cursor: pointer;
            background: #8c5b5b;
        }
    </style>
</head>

<body>

    <div><button id="btn">button</button></div>

    <script src="script.js"></script>
</body>

</html>
